name: BOTO3 tests

on:
  push:
    branches:
      - main # list of branches to trigger the workflow on push

jobs:
  run-pytest:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # to allow the workflow to create a new token for the boto3 tests
      contents: read # to allow the workflow to read the repository contents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam:${{secrets.AWS_ROLE_ARN}}:role/${{secrets.AWS_ROLE_NAME}}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run pytest
        run: python boto.py
