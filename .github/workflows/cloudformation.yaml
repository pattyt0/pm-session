name: Create a S3 bucket
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              repository_owner: payload.repository_owner,
              ref: payload.ref,
              workflow: payload.workflow,
              job_workflow_ref: payload.job_workflow_ref,
              environment: payload.environment,            
              arn: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_TEST }}:role/${{ vars.AWS_ROLE_NAME }}"
            }, null, 2));
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_TEST }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: us-east-1
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file s3.yaml \
            --stack-name pm-s3-stack \
            --no-fail-on-empty-changeset
