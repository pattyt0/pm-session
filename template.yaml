AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura economica para un sistema de gestion de documentos usando EC2,
  Python, DynamoDB y S3. Pensado para pruebas con Postman.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
    Description: Tipo de instancia EC2 economica. t4g.nano usa ARM64.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 ARM64 mas reciente.
  AppCodeUrl:
    Type: String
    Default: https://raw.githubusercontent.com/pattyt0/pm-session/main/app/document_api.py
    Description: URL raw de GitHub desde donde la EC2 descarga el codigo Python de la API REST.

Resources:
  # =========================================================================
  # 1. NETWORKING MINIMO PARA EC2 PUBLICA
  # =========================================================================
  DocVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: DocMgmtVPC

  DocPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DocVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: DocPublicSubnet

  DocInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: DocIGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DocVPC
      InternetGatewayId: !Ref DocInternetGateway

  DocPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DocVPC
      Tags:
        - Key: Name
          Value: DocPublicRouteTable

  DocPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref DocPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DocInternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DocPublicSubnet
      RouteTableId: !Ref DocPublicRouteTable

  DocApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite acceso HTTP publico para probar la API desde Postman
      VpcId: !Ref DocVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: DocApiSecurityGroup

  # =========================================================================
  # 1. BASE DE DATOS (DynamoDB) - crea una tabla en dynamoDB `DocumentosMetadata`
  # solucion barata/para trafico bajo porque se paga por request en lugar de solicitar una capacidad
  # PK - folio
  # =========================================================================
  DocumentosMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DocumentosMetadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: folio
          AttributeType: S
      KeySchema:
        - AttributeName: folio
          KeyType: HASH

  DocStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE]
            AllowedOrigins: ['*']
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldFiles
            Status: Enabled
            ExpirationInDays: 7

  # =========================================================================
  # 3. IAM PARA LA INSTANCIA EC2
  # =========================================================================
  DocEc2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DocEc2DocumentApiRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocEc2DocumentApiPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt DocumentosMetadataTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${DocStorageBucket}/*'

  DocEc2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DocEc2Role

  # =========================================================================
  # 4. EC2 CON API PYTHON
  # =========================================================================
  DocApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DocEc2InstanceProfile
      SubnetId: !Ref DocPublicSubnet
      SecurityGroupIds:
        - !Ref DocApiSecurityGroup
      Tags:
        - Key: Name
          Value: DocApiPythonInstance
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf update -y
          dnf install -y python3 python3-boto3 curl

          curl --fail --location --silent --show-error '${AppCodeUrl}' --output /opt/document_api.py
          chmod 0644 /opt/document_api.py

          cat > /etc/systemd/system/document-api.service <<'SERVICE'
          [Unit]
          Description=Document Management Python API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Environment=TABLE_NAME=${DocumentosMetadataTable}
          Environment=BUCKET_NAME=${DocStorageBucket}
          Environment=AWS_REGION=${AWS::Region}
          ExecStart=/usr/bin/python3 /opt/document_api.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable document-api
          systemctl start document-api

Outputs:
  ApiEndpoint:
    Description: URL base de la API Python en EC2 para probar con Postman
    Value: !Sub 'http://${DocApiInstance.PublicDnsName}'

  HealthEndpoint:
    Description: Endpoint de health check de la API
    Value: !Sub 'http://${DocApiInstance.PublicDnsName}/health'

  StorageBucketName:
    Description: Nombre del bucket S3 de almacenamiento de documentos
    Value: !Ref DocStorageBucket

  InstanceId:
    Description: ID de la instancia EC2 que ejecuta la API Python
    Value: !Ref DocApiInstance
